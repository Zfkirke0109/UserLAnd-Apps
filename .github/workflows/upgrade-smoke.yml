name: Install launch and upgrade smoke tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  upgrade-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'Build and release all UserLAnd launcher APKs')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # API 35 is the release target; API 36 is the next platform a user's
        # device will be on, and a first run has to work on both.
        api-level: [35, 36]
        app:
          - foxbox
          - andacious
          - gnuplot
          - r
          - libredocs
          - devstudio
          - inkscape
          - birdbox
          - gimp
          - idle
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platforms and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-31' \
            'platforms;android-35' \
            'build-tools;30.0.3' \
            'build-tools;35.0.0'
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Restore shared dependency cache
        id: dependency-cache
        uses: actions/cache@v4
        with:
          path: |
            build/shared
            .cache/dependencies
          key: ${{ runner.os }}-userland-dependencies-${{ hashFiles('dependencies.lock.json', 'scripts/prepare_dependencies.sh', 'tools/stage_support_assets.py', 'tools/verify_dependency_tree.py') }}

      - name: Prepare locked shared dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: scripts/prepare_dependencies.sh dependencies.lock.json build/shared .cache/dependencies

      - name: Verify cached shared dependencies
        if: steps.dependency-cache.outputs.cache-hit == 'true'
        run: python3 tools/verify_dependency_tree.py build/shared

      - name: Set up Gradle Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/prepare_signing.sh

      - name: Read app and r2 metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${{ matrix.app }}" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          apps = json.load(open("sources.lock.json", encoding="utf-8"))["apps"]
          app = next(item for item in apps if item["id"] == sys.argv[1])
          release = json.load(open("release.lock.json", encoding="utf-8"))
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write(f"package={app['package_id']}\n")
              output.write(f"apk={app['output_name']}\n")
              output.write(f"version_name={release['version_name']}\n")
          PY

      - name: Download published rc1 APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rc1_dir="$RUNNER_TEMP/rc1"
          mkdir -p "$rc1_dir"
          gh release download v2026.08.29-rc1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "${{ steps.meta.outputs.apk }}" \
            --dir "$rc1_dir"
          gh release download v2026.08.29-rc1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS \
            --dir "$rc1_dir"
          grep -F "  ${{ steps.meta.outputs.apk }}" "$rc1_dir/SHA256SUMS" \
            > "$rc1_dir/expected-sha256"
          (cd "$rc1_dir" && sha256sum --check expected-sha256)
          cp "$rc1_dir/${{ steps.meta.outputs.apk }}" "$RUNNER_TEMP/old.apk"

      - name: Build signed r2 APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          scripts/build_app.sh "${{ matrix.app }}"
          cp "dist/${{ steps.meta.outputs.apk }}" "$RUNNER_TEMP/new.apk"

      - name: Set up Java 17 for emulator tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run emulator install launch and upgrade check
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: scripts/emulator_smoke.sh "${{ steps.meta.outputs.package }}" "$RUNNER_TEMP/old.apk" "$RUNNER_TEMP/new.apk" "evidence/${{ matrix.app }}-api${{ matrix.api-level }}" "${{ steps.meta.outputs.version_name }}" "${{ matrix.api-level }}"

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-api${{ matrix.api-level }}-evidence
          path: evidence/${{ matrix.app }}-api${{ matrix.api-level }}
          if-no-files-found: warn
          retention-days: 14

      - name: Upload verified signed APK
        if: matrix.api-level == 35
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-verified-apk
          path: dist/${{ steps.meta.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: >-
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'Build and release all UserLAnd launcher APKs')
    needs: upgrade-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: v2026.08.29-r2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install APK inspection tools
        run: |
          sdkmanager 'build-tools;35.0.0'
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Download all emulator-verified APKs
        uses: actions/download-artifact@v4
        with:
          pattern: '*-verified-apk'
          path: dist
          merge-multiple: true

      - name: Download all runtime evidence
        uses: actions/download-artifact@v4
        with:
          pattern: '*-upgrade-evidence'
          path: evidence

      - name: Require twenty complete first-run evidence bundles
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t bundles < <(
            find evidence -mindepth 1 -maxdepth 1 -type d \
              -name '*-api*-evidence' -print | sort
          )
          # Ten apps on two API levels; a release that ships without one of
          # them is shipping a first run nobody watched.
          test "${#bundles[@]}" -eq 20
          for api in 35 36; do
            count=$(printf '%s\n' "${bundles[@]}" | grep -c -- "-api$api-evidence")
            test "$count" -eq 10
          done
          for bundle in "${bundles[@]}"; do
            for required in \
              result.txt \
              pid-stability.txt \
              ui.xml \
              permissions.txt \
              screenshot.png \
              setup-complete.png \
              relaunch.png \
              download-journal.json \
              payload-digest-report.txt \
              success-markers.txt \
              services.txt \
              logcat.txt \
              crash-buffer.txt; do
              test -s "$bundle/$required"
            done
            # A bundle that recorded a pending transfer is not a passing run.
            test ! -s "$bundle/pending-parts.txt"
            test ! -s "$bundle/forbidden-signatures.txt"
          done

      - name: Generate and verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 10
          python3 tools/release_manifest.py \
            --dist dist \
            --sources-lock sources.lock.json \
            --dependencies-lock dependencies.lock.json \
            --release-lock release.lock.json

      - name: Tag verified commit and publish r2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          else
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --generate-notes
          fi
