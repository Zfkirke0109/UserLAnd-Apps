name: Manually rebuild UserLAnd r2 APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app:
          - foxbox
          - andacious
          - gnuplot
          - r
          - libredocs
          - devstudio
          - inkscape
          - birdbox
          - gimp
          - idle
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platforms and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-31' \
            'platforms;android-35' \
            'build-tools;30.0.3' \
            'build-tools;35.0.0'
          echo "$ANDROID_SDK_ROOT/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Restore shared dependency cache
        id: dependency-cache
        uses: actions/cache@v4
        with:
          path: |
            build/shared
            .cache/dependencies
          key: ${{ runner.os }}-userland-dependencies-${{ hashFiles('dependencies.lock.json', 'scripts/prepare_dependencies.sh', 'tools/stage_support_assets.py', 'tools/verify_dependency_tree.py') }}

      - name: Prepare locked shared dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: scripts/prepare_dependencies.sh dependencies.lock.json build/shared .cache/dependencies

      - name: Verify cached shared dependencies
        if: steps.dependency-cache.outputs.cache-hit == 'true'
        run: python3 tools/verify_dependency_tree.py build/shared

      - name: Verify signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/prepare_signing.sh

      - name: Build signed r2 APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/build_app.sh "${{ matrix.app }}"

      - name: Read expected package and r2 metadata
        id: meta
        shell: bash
        run: |
          python3 - "${{ matrix.app }}" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          apps = json.load(open("sources.lock.json", encoding="utf-8"))["apps"]
          app = next(item for item in apps if item["id"] == sys.argv[1])
          release = json.load(open("release.lock.json", encoding="utf-8"))
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write(f"package={app['package_id']}\n")
              output.write(f"apk={app['output_name']}\n")
              output.write(f"version_code={release['version_code']}\n")
              output.write(f"version_name={release['version_name']}\n")
          PY

      - name: Verify exact r2 APK metadata and certificate
        shell: bash
        run: |
          set -euo pipefail
          apk="dist/${{ steps.meta.outputs.apk }}"
          badging=$(aapt dump badging "$apk")
          grep -F "package: name='${{ steps.meta.outputs.package }}' versionCode='${{ steps.meta.outputs.version_code }}' versionName='${{ steps.meta.outputs.version_name }}'" <<< "$badging"
          certificate=$(apksigner verify --verbose --print-certs "$apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          expected=$(tr -d ':' <<< '82:9A:55:6F:C5:8A:D5:24:9B:5D:4C:4A:7F:CB:9A:96:9C:FF:38:26:AA:5C:7E:41:02:C3:13:B2:20:A4:5F:EC' |
            tr '[:upper:]' '[:lower:]')
          test "$certificate" = "$expected"

      - name: Upload signed r2 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-signed-r2-apk
          path: dist/${{ steps.meta.outputs.apk }}
          if-no-files-found: error
          retention-days: 14
