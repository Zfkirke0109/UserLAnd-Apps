name: Publish UserLAnd apps release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app:
          - foxbox
          - andacious
          - gnuplot
          - r
          - libredocs
          - devstudio
          - inkscape
          - birdbox
          - gimp
          - idle
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platforms and build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-31' \
            'platforms;android-35' \
            'build-tools;30.0.3' \
            'build-tools;35.0.0'

      - name: Restore shared dependency cache
        id: dependency-cache
        uses: actions/cache@v4
        with:
          path: |
            build/shared
            .cache/dependencies
          key: ${{ runner.os }}-userland-dependencies-${{ hashFiles('dependencies.lock.json', 'scripts/prepare_dependencies.sh', 'tools/verify_dependency_tree.py') }}

      - name: Prepare locked shared dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: scripts/prepare_dependencies.sh dependencies.lock.json build/shared .cache/dependencies

      - name: Verify cached shared dependencies
        if: steps.dependency-cache.outputs.cache-hit == 'true'
        run: python3 tools/verify_dependency_tree.py build/shared

      - name: Set up Gradle Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.app == 'foxbox' && '11' || '17' }}
          cache: gradle

      - name: Verify signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/prepare_signing.sh

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          version_code=$((2000000000 + GITHUB_RUN_NUMBER))
          if (( version_code > 2100000000 )); then
            echo 'GitHub run number exceeds Android version-code range' >&2
            exit 1
          fi
          scripts/build_app.sh \
            "${{ matrix.app }}" \
            "$version_code" \
            "$GITHUB_REF_NAME"

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find dist -maxdepth 1 -type f -name '*.apk' -print)
          test -n "$apk"
          apksigner verify --verbose --print-certs "$apk"
          aapt dump badging "$apk" | head -1

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-signed-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install APK inspection tools
        run: sdkmanager 'build-tools;35.0.0'

      - name: Download all signed APKs
        uses: actions/download-artifact@v4
        with:
          pattern: '*-signed-apk'
          path: dist
          merge-multiple: true

      - name: Generate and verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 10
          python3 tools/release_manifest.py \
            --dist dist \
            --lock sources.lock.json \
            --release-tag "$GITHUB_REF_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
